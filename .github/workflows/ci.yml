name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Tesseract dependencies (for CGO linting)
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev

      - name: Download tessdata for embedding
        run: ./scripts/ensure-tessdata.sh

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev

      - name: Download tessdata for embedding
        run: ./scripts/ensure-tessdata.sh

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags="-s -w" -o image-tools-mcp.exe ./cmd/image-mcp
          else
            go build -ldflags="-s -w" -o image-tools-mcp ./cmd/image-mcp
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: image-tools-mcp*

  # Static-link regression gate: catch a non-static build at PR time instead of
  # at release. Builds the same Dockerfile.static used by the release legs (§4),
  # asserts the binary is fully static, and runs the OCR smoke to prove the
  # embedded Tesseract/tessdata work with no system Tesseract present. The
  # lint/test/build jobs above stay the fast dynamic gates.
  static-build:
    name: Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary (host arch)
        run: |
          docker buildx build \
            -f Dockerfile.static \
            --target export-binaries \
            -o type=local,dest=build-out \
            .
          mv build-out/image-tools-mcp image-tools-mcp-static
          chmod +x image-tools-mcp-static

      - name: Assert static binary
        run: |
          ldd image-tools-mcp-static 2>&1 | grep -q "not a dynamic executable" \
            || { echo "ERROR: binary is dynamically linked"; ldd image-tools-mcp-static; exit 1; }
          file image-tools-mcp-static | grep -q "statically linked" \
            || { echo "ERROR: file does not report statically linked"; file image-tools-mcp-static; exit 1; }
          echo "OK: image-tools-mcp-static is statically linked"

      - name: Smoke test - OCR with embedded tesseract
        run: |
          TEST_IMAGE="$(pwd)/testdata/simple_diagram.png"
          RESPONSE=$(echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"image_ocr_full\",\"arguments\":{\"path\":\"${TEST_IMAGE}\",\"language\":\"eng\"}}}" | \
            timeout 30 ./image-tools-mcp-static | head -50)
          echo "OCR response: $RESPONSE"
          echo "$RESPONSE" | grep -q "tesseract not found" \
            && { echo "ERROR: OCR could not find embedded tesseract"; exit 1; }
          echo "$RESPONSE" | grep -q "full_text" \
            || { echo "ERROR: OCR did not return a result"; exit 1; }
          echo "OK: OCR ran against the static binary with embedded tesseract"

      - name: Upload static binary for cross-base gate
        uses: actions/upload-artifact@v4
        with:
          name: cross-base-binary
          path: image-tools-mcp-static
          retention-days: 1

  # Cross-base acceptance gate (sprint definition of done): the SAME static
  # binary must run identically on multiple, unrelated base images. Drop it into
  # Debian bookworm, Debian trixie, and bare Alpine, and in each run ldd (static),
  # --version, tools/list, and the OCR smoke — proving base/soname independence
  # with no system Tesseract anywhere. A failure in any base is a hard stop.
  cross-base:
    name: Cross-base (${{ matrix.base }})
    runs-on: ubuntu-latest
    needs: static-build
    strategy:
      fail-fast: false
      matrix:
        base:
          - debian:bookworm-slim
          - debian:trixie-slim
          - alpine:3.20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download static binary
        uses: actions/download-artifact@v4
        with:
          name: cross-base-binary

      - name: Run acceptance checks in ${{ matrix.base }}
        run: |
          chmod +x image-tools-mcp-static
          docker run --rm \
            -v "$(pwd)/image-tools-mcp-static:/work/bin:ro" \
            -v "$(pwd)/testdata/simple_diagram.png:/work/test.png:ro" \
            "${{ matrix.base }}" sh -c '
              set -e
              echo "### ldd (must report static — glibc and musl phrase it differently)"
              ldd /work/bin 2>&1 | grep -E "not a dynamic executable|Not a valid dynamic program|statically linked" \
                || { echo "ERROR: binary is not static in ${{ matrix.base }}"; ldd /work/bin; exit 1; }

              echo "### --version (must exit 0)"
              /work/bin --version

              echo "### tools/list (must return image_load)"
              echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" | /work/bin | grep -q image_load \
                || { echo "ERROR: tools/list did not return image_load"; exit 1; }

              echo "### OCR smoke (embedded tesseract, no system Tesseract)"
              R=$(echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"image_ocr_full\",\"arguments\":{\"path\":\"/work/test.png\",\"language\":\"eng\"}}}" | /work/bin | head -50)
              echo "$R"
              echo "$R" | grep -q "tesseract not found" && { echo "ERROR: OCR could not find embedded tesseract"; exit 1; }
              echo "$R" | grep -q "full_text" || { echo "ERROR: OCR did not return a result"; exit 1; }

              echo "OK: all checks passed in ${{ matrix.base }}"
            '
